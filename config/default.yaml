audio:
  sample_rate: 16000
  device: null              # sounddevice name or index, null = system default
  frame_ms: 32
buffer:
  seconds: 10
gate:
  enabled: true
  n_fft: 1024
  hop: 256
  band_hz: [800, 3000]      # ASSUMPTION, tune on real recordings
  peak_to_median_db: 15
  freq_tolerance_hz: 50
  min_stable_frames: 5
  burst_min_s: 0.25
  burst_max_s: 1.0
  pulse_period_s: [0.6, 1.5]
  confirm_timeout_s: 1.6    # a gate candidate waits this long for the classifier to confirm it
  confirm_with_classifier: true   # a gate hit alone never shows BACKUP ALARM when a classifier runs
classifier:
  enabled: true
  model_path: models/yamnet_classification.tflite   # final name set by fetch_models.py
  class_map_path: models/yamnet_class_map.csv
  hop_s: 0.25
  smoothing: {hits: 2, windows: 3}
  # The sound catalog. Names must match the AudioSet class map exactly. label1 and label2 are the
  # two display lines (at most 12 characters). default_level is used when a profile does not say.
  # Thresholds are placeholders until we tune them on real recordings. Being listed here does not
  # mean a sound is detected reliably.
  classes:
    reversing_alarm:
      names: ['Reversing beeps']
      threshold: 0.30
      label1: BACKUP ALARM
      label2: NEARBY
      default_level: interrupt
    vehicle_horn:
      names: ['Vehicle horn, car horn, honking', 'Air horn, truck horn']
      threshold: 0.30
      label1: VEHICLE HORN
      label2: NEARBY
      default_level: interrupt
    fire_alarm:               # also covers smoke detectors
      names: ['Fire alarm', 'Smoke detector, smoke alarm']
      threshold: 0.30
      label1: FIRE ALARM
      label2: NEARBY
      default_level: interrupt
    doorbell:                 # also covers Ding-dong
      names: ['Doorbell', 'Ding-dong']
      threshold: 0.30
      label1: DOORBELL
      label2: NEARBY
      default_level: interrupt
    knock:
      names: ['Knock']
      threshold: 0.30
      label1: KNOCK
      label2: NEARBY
      default_level: quiet
    siren:                    # also covers police and ambulance sirens
      names: ['Siren', 'Police car (siren)', 'Ambulance (siren)']
      threshold: 0.30
      label1: SIREN
      label2: NEARBY
      default_level: interrupt
    bicycle_bell:
      names: ['Bicycle bell']
      threshold: 0.30
      label1: BICYCLE BELL
      label2: NEARBY
      default_level: quiet
    baby_cry:
      names: ['Baby cry, infant cry']
      threshold: 0.30
      label1: BABY CRY
      label2: NEARBY
      default_level: interrupt
    microwave:
      names: ['Microwave oven']
      threshold: 0.30
      label1: MICROWAVE
      label2: NEARBY
      default_level: later
    alarm_clock:
      names: ['Alarm clock']
      threshold: 0.30
      label1: ALARM CLOCK
      label2: NEARBY
      default_level: quiet
policy:
  cooldown_s: 5.0
  ttl_s: 3.0
  blink: true               # interrupt alerts ask for blink. A display without it emulates or ignores it
  priority: [fire_alarm, siren, reversing_alarm, vehicle_horn, baby_cry, doorbell, knock,
             alarm_clock, bicycle_bell, microwave]
  protected: [fire_alarm]   # always interrupt, even if the active profile says quiet, later or off
# Named profiles. Each sets a level for every sound: interrupt, quiet, later or off.
# These are starting assumptions about what each situation needs. Edit them freely.
profiles:
  active: home
  # SIMULATED context triggers for the demo. Tapping one on the phone page switches the profile.
  # Nothing here detects a place, a movement or the time of day, and the page says so.
  triggers:
    leave_home: {label: Leaving home, profile: commute}
    arrive_home: {label: Arriving home, profile: home}
    start_focus: {label: Starting focus time, profile: focus}
    go_to_sleep: {label: Going to sleep, profile: sleep}
  definitions:
    focus:                  # studying or deep work: only urgent things get through
      label: Focus
      sensitivity: 1.0
      levels:
        fire_alarm: interrupt
        siren: quiet
        reversing_alarm: quiet
        vehicle_horn: later
        baby_cry: quiet
        doorbell: later
        knock: later
        alarm_clock: later
        bicycle_bell: off
        microwave: later
    home:                   # at home and awake. Home is the default, so it keeps the original
      label: Home           # behavior for backup alarms and horns
      sensitivity: 1.0
      levels:
        fire_alarm: interrupt
        siren: quiet
        reversing_alarm: interrupt
        vehicle_horn: later
        baby_cry: interrupt
        doorbell: interrupt
        knock: interrupt
        alarm_clock: quiet
        bicycle_bell: off
        microwave: quiet
    sleep:                  # asleep: only what must wake you
      label: Sleep
      sensitivity: 1.0
      levels:
        fire_alarm: interrupt
        siren: later
        reversing_alarm: off
        vehicle_horn: off
        baby_cry: interrupt
        doorbell: off
        knock: off
        alarm_clock: off
        bicycle_bell: off
        microwave: off
    commute:                # walking, cycling or riding with headphones or earmuffs
      label: Commute
      sensitivity: 1.0
      levels:
        fire_alarm: interrupt
        siren: interrupt
        reversing_alarm: interrupt
        vehicle_horn: interrupt
        baby_cry: quiet
        doorbell: off
        knock: off
        alarm_clock: off
        bicycle_bell: interrupt
        microwave: off
display:
  adapter: console          # console | sim | bridge | microlumin
  caps:
    lines: 2
    max_chars_per_line: 12  # ASSUMPTION
    color: mono_green       # ASSUMPTION
    supports_blink: false
dashboard:
  enabled: true
  host: 127.0.0.1
  port: 8765
eventlog:
  path: data/events.sqlite
recording:
  enabled: false            # only true with the --record flag
  dir: data/recordings
